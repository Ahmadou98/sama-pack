<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#166534">
  <title>Connexion indisponible | SAMA-PACK</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5faf6;color:#17251d;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);padding:clamp(24px,6vw,38px);border:1px solid #dce9df;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.07);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 16px;display:grid;place-items:center;border-radius:16px;background:#166534;color:#fff;font-size:30px;font-weight:900}
    .brand{margin:0 0 22px;color:#166534;font-size:17px;font-weight:900;letter-spacing:.06em}
    h1{margin:0 0 12px;font-size:clamp(25px,6vw,32px);line-height:1.15}
    p{margin:0 0 20px;color:#5b6c60}
    .note{padding:12px 14px;border-radius:12px;background:#f0fdf4;color:#365b43;font-size:13px}
    button,a{display:block;width:100%;margin-top:16px;padding:13px 16px;border:0;border-radius:11px;background:#166534;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
    a{margin-top:10px;background:#f0fdf4;color:#166534}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <div class="brand">SAMA-PACK</div>
    <h1>Connexion Internet indisponible</h1>
    <p>La boutique a besoin d’une connexion pour afficher les produits, les prix et les disponibilités à jour.</p>
    <div class="note">Aucune commande n’a été envoyée. Réessayez une fois la connexion rétablie.</div>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
    <a href="/">Retour à la boutique</a>
  </main>
</body>
</html>
