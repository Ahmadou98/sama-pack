<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Commande SAMA-PACK préparée dans WhatsApp</title><desc id="desc">Un message récapitule les articles sélectionnés, leur quantité et le paiement à la livraison.</desc>
<rect width="1200" height="660" rx="24" fill="#edf4ef"/><rect x="24" y="24" width="1152" height="612" rx="20" fill="#fff" stroke="#dbe5dd" stroke-width="2"/>
<rect x="24" y="24" width="1152" height="74" rx="20" fill="#fff"/><text x="58" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">SAMA-PACK</text><text x="58" y="85" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#64746a">NETTOYAGE ET HYGIÈNE</text><text x="650" y="67" font-family="Arial,sans-serif" font-size="15" fill="#475569">Packs</text><text x="725" y="67" font-family="Arial,sans-serif" font-size="15" fill="#475569">Produits</text><text x="820" y="67" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#166534">Panier</text>
<text x="60" y="153" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#166534">COMMANDE PRÉPARÉE</text><text x="60" y="194" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17251d">Votre sélection, prête à être envoyée</text>
<rect x="60" y="224" width="690" height="340" rx="18" fill="#f7faf8" stroke="#dbe5dd" stroke-width="2"/>
<rect x="60" y="224" width="690" height="62" rx="18" fill="#166534"/><circle cx="97" cy="255" r="18" fill="#fff" opacity=".18"/><path d="M87 250c2-8 15-8 19 0 2 6-6 15-10 17-4-2-11-10-9-17Z" fill="none" stroke="#fff" stroke-width="2"/><text x="130" y="252" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">WhatsApp · SAMA-PACK</text><text x="130" y="270" font-family="Arial,sans-serif" font-size="12" fill="#d9f0e0">Message à envoyer</text>
<rect x="91" y="309" width="610" height="224" rx="14" fill="#e9f7ed"/><text x="119" y="346" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17251d">Bonjour SAMA-PACK,</text><text x="119" y="379" font-family="Arial,sans-serif" font-size="15" fill="#34483b">Je souhaite commander les articles suivants :</text>
<rect x="119" y="400" width="552" height="43" rx="8" fill="#fff" stroke="#d7e8dc"/><text x="137" y="427" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17251d">1 × Pack Grand Ménage Mensuel</text><text x="646" y="427" font-family="Arial,sans-serif" font-size="15" text-anchor="end" fill="#166534">16 000 F</text>
<text x="119" y="469" font-family="Arial,sans-serif" font-size="14" fill="#34483b">Livraison à confirmer · Paiement à la livraison</text><text x="119" y="506" font-family="Arial,sans-serif" font-size="13" fill="#64746a">Adresse et coordonnées à compléter si nécessaire.</text>
<rect x="800" y="224" width="340" height="340" rx="18" fill="#fff" stroke="#dbe5dd" stroke-width="2"/>
<circle cx="970" cy="300" r="43" fill="#e7f5ec"/><path d="M950 302l13 13 27-30" fill="none" stroke="#166534" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="970" y="380" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#17251d">Vérifiez le message</text><text x="970" y="410" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">Les articles, quantités et prix</text><text x="970" y="433" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">sont déjà récapitulés.</text>
<rect x="855" y="463" width="230" height="48" rx="10" fill="#166534"/><text x="970" y="493" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Envoyer dans WhatsApp</text>
<text x="60" y="610" font-family="Arial,sans-serif" font-size="14" fill="#64746a">Le message s’ouvre dans WhatsApp. Vous devez appuyer sur « Envoyer » pour transmettre votre demande.</text></svg>