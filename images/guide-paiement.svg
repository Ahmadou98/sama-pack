<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title"><title id="title">Aperçu illustratif du formulaire de paiement</title>
<rect width="1200" height="660" rx="24" fill="#edf4ef"/><rect x="24" y="24" width="1152" height="612" rx="20" fill="#fff" stroke="#dbe5dd" stroke-width="2"/>
<rect x="24" y="24" width="1152" height="74" rx="20" fill="#fff"/><text x="58" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">SAMA-PACK</text><text x="58" y="85" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#64746a">NETTOYAGE ET HYGIÈNE</text><text x="650" y="67" font-family="Arial,sans-serif" font-size="15" fill="#475569">Packs</text><text x="725" y="67" font-family="Arial,sans-serif" font-size="15" fill="#475569">Produits</text><text x="820" y="67" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#166534">Aide</text>
<text x="58" y="141" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#166534">FINALISATION</text><text x="58" y="180" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17251d">Vos informations de livraison</text><rect x="58" y="204" width="565" height="66" rx="10" fill="#fff" stroke="#cbd5ce" stroke-width="2"/><text x="77" y="230" font-family="Arial,sans-serif" font-size="12" fill="#64746a">Nom complet</text><text x="77" y="253" font-family="Arial,sans-serif" font-size="15" fill="#17251d">Votre nom</text><rect x="58" y="283" width="267" height="66" rx="10" fill="#fff" stroke="#cbd5ce" stroke-width="2"/><text x="77" y="309" font-family="Arial,sans-serif" font-size="12" fill="#64746a">Téléphone</text><text x="77" y="332" font-family="Arial,sans-serif" font-size="15" fill="#17251d">Votre numéro</text><rect x="339" y="283" width="284" height="66" rx="10" fill="#fff" stroke="#cbd5ce" stroke-width="2"/><text x="358" y="309" font-family="Arial,sans-serif" font-size="12" fill="#64746a">Zone / quartier</text><text x="358" y="332" font-family="Arial,sans-serif" font-size="15" fill="#17251d">Votre zone</text><rect x="58" y="362" width="565" height="66" rx="10" fill="#fff" stroke="#cbd5ce" stroke-width="2"/><text x="77" y="388" font-family="Arial,sans-serif" font-size="12" fill="#64746a">Adresse de livraison</text><text x="77" y="411" font-family="Arial,sans-serif" font-size="15" fill="#17251d">Rue, repère ou indication utile</text>
<text x="670" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17251d">Choisissez le paiement</text><rect x="666" y="204" width="468" height="112" rx="13" fill="#f0fdf4" stroke="#166534" stroke-width="2"/><circle cx="696" cy="237" r="10" fill="#166534"/><circle cx="696" cy="237" r="4" fill="#fff"/><text x="720" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17251d">Payer maintenant</text><text x="720" y="269" font-family="Arial,sans-serif" font-size="14" fill="#475569">Régler le montant total sur la page</text><text x="720" y="290" font-family="Arial,sans-serif" font-size="14" fill="#475569">sécurisée du prestataire.</text><rect x="666" y="331" width="468" height="112" rx="13" fill="#fff" stroke="#dbe5dd" stroke-width="2"/><circle cx="696" cy="364" r="10" fill="#fff" stroke="#64746a" stroke-width="2"/><text x="720" y="367" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17251d">Payer plus tard</text><text x="720" y="396" font-family="Arial,sans-serif" font-size="14" fill="#475569">Payer la livraison en ligne, puis le solde</text><text x="720" y="417" font-family="Arial,sans-serif" font-size="14" fill="#475569">des articles à la livraison.</text><rect x="666" y="458" width="468" height="51" rx="10" fill="#166534"/><text x="900" y="490" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Continuer vers le paiement sécurisé</text><rect x="58" y="536" width="1076" height="65" rx="11" fill="#f8fafc" stroke="#dbe5dd"/><text x="80" y="562" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">Paiement vérifié</text><text x="80" y="585" font-family="Arial,sans-serif" font-size="14" fill="#475569">La commande est mise à jour après confirmation du prestataire, pas simplement au retour.</text></svg>