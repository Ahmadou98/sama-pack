<rect x="24" y="24" width="1152" height="74" rx="20" fill="#fff"/><text x="58" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">SAMA-PACK</text><text x="58" y="85" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#64746a">NETTOYAGE ET HYGIÈNE</text><text x="650" y="67" font-family="Arial,sans-serif" font-size="15" fill="#475569">Packs</text><text x="725" y="67" font-family="Arial,sans-serif" font-size="15" fill="#475569">Produits</text><text x="820" y="67" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#166534">Aide</text>
<text x="58" y="143" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#166534">MON COMPTE</text><text x="58" y="182" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17251d">Mes commandes</text><text x="58" y="210" font-family="Arial,sans-serif" font-size="15" fill="#64746a">Consultez le statut de vos commandes et le suivi des paiements.</text><rect x="56" y="236" width="1085" height="59" rx="9" fill="#f8fafc"/><text x="79" y="271" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">COMMANDE</text><text x="303" y="271" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">DATE</text><text x="475" y="271" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">TOTAL</text><text x="636" y="271" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">PAIEMENT</text><text x="811" y="271" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">STATUT</text><path d="M56 295h1085" stroke="#dbe5dd" stroke-width="2"/><text x="79" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17251d">CMD-EXEMPLE</text><text x="303" y="343" font-family="Arial,sans-serif" font-size="15" fill="#475569">Date de commande</text><text x="475" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17251d">25 050 FCFA</text><text x="636" y="343" font-family="Arial,sans-serif" font-size="15" fill="#475569">Payé</text><rect x="811" y="320" width="140" height="32" rx="16" fill="#dcfce7"/><text x="881" y="341" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">En préparation</text><rect x="965" y="315" width="148" height="40" rx="9" fill="#fff" stroke="#cbd5ce"/><text x="1039" y="340" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#17251d">Voir / reçu</text><rect x="56" y="402" width="1085" height="118" rx="14" fill="#f0fdf4"/><text x="83" y="443" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#166534">Retrouvez les informations de votre commande</text><text x="83" y="473" font-family="Arial,sans-serif" font-size="15" fill="#475569">Connectez-vous avec la même adresse e-mail pour consulter</text><text x="83" y="497" font-family="Arial,sans-serif" font-size="15" fill="#475569">l’évolution, le montant payé et le solde éventuel.</text><rect x="56" y="541" width="1085" height="57" rx="11" fill="#fff" stroke="#dbe5dd"/><circle cx="84" cy="570" r="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/><path d="M79 570l4 4 7-8" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="575" font-family="Arial,sans-serif" font-size="14" fill="#475569">Exemple visuel uniquement : aucune donnée réelle de client n’est affichée.</text></svg>