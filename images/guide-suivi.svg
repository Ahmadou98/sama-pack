<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Confirmation et paiement à la livraison SAMA-PACK</title><desc id="desc">L’équipe confirme la commande, le livreur remet les articles et le client règle à la réception.</desc>
<rect width="1200" height="660" rx="24" fill="#edf4ef"/><rect x="24" y="24" width="1152" height="612" rx="20" fill="#fff" stroke="#dbe5dd" stroke-width="2"/>
<text x="60" y="91" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#166534">APRÈS L’ENVOI DE VOTRE MESSAGE</text><text x="60" y="139" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17251d">Une confirmation, puis votre livraison</text><text x="60" y="174" font-family="Arial,sans-serif" font-size="16" fill="#64746a">L’équipe vérifie la demande et vous confirme les modalités dans WhatsApp.</text>
<path d="M205 335H995" stroke="#d5e5da" stroke-width="8" stroke-linecap="round"/>
<circle cx="205" cy="335" r="72" fill="#e8f5ec" stroke="#c8e4d1" stroke-width="3"/><circle cx="205" cy="335" r="39" fill="#166534"/><path d="M186 335l13 13 27-30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="335" r="72" fill="#e8f5ec" stroke="#c8e4d1" stroke-width="3"/><path d="M555 315h57v39h-57zM612 326h22l17 18v10h-39z" fill="none" stroke="#166534" stroke-width="5" stroke-linejoin="round"/><circle cx="575" cy="362" r="9" fill="#166534"/><circle cx="631" cy="362" r="9" fill="#166534"/>
<circle cx="995" cy="335" r="72" fill="#e8f5ec" stroke="#c8e4d1" stroke-width="3"/><rect x="968" y="306" width="54" height="39" rx="6" fill="none" stroke="#166534" stroke-width="5"/><path d="M968 318h54M980 333h17" stroke="#166534" stroke-width="4" stroke-linecap="round"/><path d="M994 282v-13M985 277l9-9 9 9" fill="none" stroke="#166534" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="449" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#17251d">01 · Confirmation</text><text x="205" y="481" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">Disponibilité, total et</text><text x="205" y="504" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">créneau confirmés.</text>
<text x="600" y="449" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#17251d">02 · Livraison</text><text x="600" y="481" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">Vous recevez les articles</text><text x="600" y="504" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">à l’adresse convenue.</text>
<text x="995" y="449" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#17251d">03 · Règlement</text><text x="995" y="481" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">Vous payez à la réception</text><text x="995" y="504" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#64746a">de votre commande.</text>
<rect x="60" y="554" width="1080" height="52" rx="12" fill="#f0f7f2" stroke="#d9e9de"/><text x="600" y="586" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#166534">Aucun paiement en ligne n’est demandé au moment de la commande.</text></svg>