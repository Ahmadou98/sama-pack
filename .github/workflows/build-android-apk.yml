name: Build SAMA-PACK Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samapack-android-release
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and publish signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure les trois secrets GitHub SAMAPACK_ANDROID_KEYSTORE_BASE64, SAMAPACK_ANDROID_KEYSTORE_PASSWORD et SAMAPACK_ANDROID_KEY_PASSWORD avant de lancer la compilation."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/android.keystore
          test -s android/android.keystore
          chmod 600 android/android.keystore

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Generate Android project from TWA manifest
        working-directory: android
        run: |
          set -euo pipefail
          BUBBLEWRAP_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v bubblewrap)")")")"
          test -d "$BUBBLEWRAP_ROOT/node_modules/@bubblewrap/core"
          NODE_PATH="$BUBBLEWRAP_ROOT/node_modules" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const {
            TwaManifest,
            TwaGenerator,
            BufferedLog,
            ConsoleLog
          } = require("@bubblewrap/core");

          (async () => {
            const projectDir = process.cwd();
            const manifestPath = path.join(projectDir, "twa-manifest.json");
            const signingKeyPath = path.join(projectDir, "android.keystore");

            if (!fs.existsSync(signingKeyPath) || fs.statSync(signingKeyPath).size === 0) {
              throw new Error("La clé privée Android SAMA-PACK est absente.");
            }

            const manifest = await TwaManifest.fromFile(manifestPath);
            if (manifest.packageId !== "sn.samapack.app") {
              throw new Error("Identifiant Android inattendu dans twa-manifest.json.");
            }
            if (manifest.signingKey.alias !== "samapack") {
              throw new Error("Alias de signature inattendu dans twa-manifest.json.");
            }
            if (path.resolve(projectDir, manifest.signingKey.path) !== path.resolve(signingKeyPath)) {
              throw new Error("Le chemin de la clé de signature ne correspond pas au keystore restauré.");
            }

            const generator = new TwaGenerator();
            const log = new BufferedLog(new ConsoleLog("SAMA-PACK Android"));
            await generator.createTwaProject(projectDir, manifest, log);

            const manifestBytes = fs.readFileSync(manifestPath);
            const checksum = crypto.createHash("sha1").update(manifestBytes).digest("hex");
            fs.writeFileSync(path.join(projectDir, "manifest-checksum.txt"), checksum);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Configure Bubblewrap Android tool paths
        working-directory: android
        run: |
          set -euo pipefail
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME"
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Build signed Android APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --manifest=twa-manifest.json

      - name: Verify APK and signing certificate
        id: verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="android/app-release-signed.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/samapack-apk-signature.txt
          KEY_FP="$(keytool -list -v -keystore android/android.keystore -alias samapack -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}')"
          APK_FP="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' /tmp/samapack-apk-signature.txt)"
          KEY_FP_NORMALIZED="$(printf '%s' "$KEY_FP" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_FP_NORMALIZED="$(printf '%s' "$APK_FP" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$KEY_FP" || "$KEY_FP_NORMALIZED" != "$APK_FP_NORMALIZED" ]]; then
            echo "::error::La signature APK ne correspond pas à la clé SAMA-PACK attendue."
            exit 1
          fi
          echo "sha256=$KEY_FP" >> "$GITHUB_OUTPUT"
          VERSION="$(node -p "require('./android/twa-manifest.json').appVersion")"
          VERSION_CODE="$(node -p "require('./android/twa-manifest.json').appVersionCode")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Prepare public APK, checksum and Digital Asset Links
        env:
          CERT_SHA256: ${{ steps.verify.outputs.sha256 }}
          APP_VERSION: ${{ steps.verify.outputs.version }}
          APP_VERSION_CODE: ${{ steps.verify.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p downloads .well-known
          cp android/app-release-signed.apk downloads/SAMA-PACK.apk
          sha256sum downloads/SAMA-PACK.apk | awk '{print $1 "  SAMA-PACK.apk"}' > downloads/SAMA-PACK.apk.sha256
          node <<'NODE'
          const fs = require("fs");
          const certificate = process.env.CERT_SHA256;
          if (!certificate || !/^[0-9A-F]{2}(:[0-9A-F]{2}){31}$/i.test(certificate)) {
            throw new Error("Empreinte SHA-256 de certificat absente ou invalide.");
          }
          const assetLinks = [{
            relation: ["delegate_permission/common.handle_all_urls"],
            target: {
              namespace: "android_app",
              package_name: "sn.samapack.app",
              sha256_cert_fingerprints: [certificate.toUpperCase()]
            }
          }];
          fs.writeFileSync(".well-known/assetlinks.json", JSON.stringify(assetLinks, null, 2) + "\n");
          const version = {
            name: "SAMA-PACK",
            version: process.env.APP_VERSION,
            versionCode: Number(process.env.APP_VERSION_CODE),
            packageName: "sn.samapack.app",
            apk: "/downloads/SAMA-PACK.apk",
            checksum: "/downloads/SAMA-PACK.apk.sha256"
          };
          fs.writeFileSync("downloads/version.json", JSON.stringify(version, null, 2) + "\n");
          NODE

      - name: Upload signed APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMA-PACK-Android-${{ steps.verify.outputs.version }}
          path: |
            downloads/SAMA-PACK.apk
            downloads/SAMA-PACK.apk.sha256
            downloads/version.json
            .well-known/assetlinks.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK and domain verification file
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SAMA-PACK.apk downloads/SAMA-PACK.apk.sha256 downloads/version.json .well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "Aucun changement de publication à enregistrer."
            exit 0
          fi
          git commit -m "Release SAMA-PACK Android v$VERSION"
          git push origin HEAD:main
