name: Build SAMA-PACK Native Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-android.yml"
      - ".assetsignore"
  pull_request:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-android.yml"
      - ".assetsignore"

permissions:
  contents: write

concurrency:
  group: samapack-native-android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify-debug:
    name: Compile native Android debug build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Compile debug APK
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK for review
        uses: actions/upload-artifact@v7
        with:
          name: SAMA-PACK-Native-Debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-release:
    name: Build and publish native signed APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check Android signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Les trois secrets de signature Android SAMA-PACK sont requis."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore existing SAMA-PACK signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/samapack-native.keystore"
          test -s "$RUNNER_TEMP/samapack-native.keystore"
          chmod 600 "$RUNNER_TEMP/samapack-native.keystore"

      - name: Build native signed release APK
        working-directory: android-native
        env:
          SAMA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/samapack-native.keystore
          SAMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_PASSWORD }}
          SAMA_ANDROID_KEY_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify native APK and signing certificate
        id: verify
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAMAPACK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/samapack-native-signature.txt

          KEY_FP="$(keytool -list -v -keystore "$RUNNER_TEMP/samapack-native.keystore" -alias samapack -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}')"
          APK_FP="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' /tmp/samapack-native-signature.txt)"
          KEY_FP_NORMALIZED="$(printf '%s' "$KEY_FP" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_FP_NORMALIZED="$(printf '%s' "$APK_FP" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [[ -z "$KEY_FP" || "$KEY_FP_NORMALIZED" != "$APK_FP_NORMALIZED" ]]; then
            echo "::error::La signature de l'application native ne correspond pas au certificat SAMA-PACK existant."
            exit 1
          fi

          APP_ID="$("$ANDROID_HOME/cmdline-tools/$(basename "$(dirname "$(dirname "$(command -v sdkmanager)")")")/bin/apkanalyzer" manifest application-id "$APK")"
          if [[ "$APP_ID" != "sn.samapack.app" ]]; then
            echo "::error::Identifiant Android inattendu : $APP_ID"
            exit 1
          fi

          echo "sha256=$KEY_FP" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"

      - name: Prepare public native APK, checksum and Digital Asset Links
        env:
          CERT_SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p downloads .well-known
          cp android-native/app/build/outputs/apk/release/app-release.apk downloads/SAMA-PACK.apk
          sha256sum downloads/SAMA-PACK.apk | awk '{print $1 "  SAMA-PACK.apk"}' > downloads/SAMA-PACK.apk.sha256

          node <<'NODE'
          const fs = require("node:fs");
          const certificate = process.env.CERT_SHA256;

          if (!certificate || !/^[0-9A-F]{2}(:[0-9A-F]{2}){31}$/i.test(certificate)) {
            throw new Error("Empreinte SHA-256 de certificat absente ou invalide.");
          }

          const assetLinks = [{
            relation: ["delegate_permission/common.handle_all_urls"],
            target: {
              namespace: "android_app",
              package_name: "sn.samapack.app",
              sha256_cert_fingerprints: [certificate.toUpperCase()]
            }
          }];
          fs.writeFileSync(".well-known/assetlinks.json", JSON.stringify(assetLinks, null, 2) + "\n");

          const version = {
            name: "SAMA-PACK",
            version: "1.1.0",
            versionCode: 2,
            packageName: "sn.samapack.app",
            appType: "native-android",
            minAndroidApi: 26,
            apk: "/downloads/SAMA-PACK.apk",
            checksum: "/downloads/SAMA-PACK.apk.sha256"
          };
          fs.writeFileSync("downloads/version.json", JSON.stringify(version, null, 2) + "\n");
          NODE

      - name: Upload signed native APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SAMA-PACK-Native-Android-1.1.0
          path: |
            downloads/SAMA-PACK.apk
            downloads/SAMA-PACK.apk.sha256
            downloads/version.json
            .well-known/assetlinks.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish native APK to main
        env:
          VERSION: "1.1.0"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SAMA-PACK.apk downloads/SAMA-PACK.apk.sha256 downloads/version.json .well-known/assetlinks.json

          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi

          git commit -m "Release native SAMA-PACK Android v$VERSION"
          git push origin HEAD:main
